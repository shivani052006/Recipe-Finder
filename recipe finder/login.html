<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Food Explorer</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: url('images/18.jpg') no-repeat center center/cover;
    }

    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.25);
    }

   .login-container {
  position: relative;
  background: linear-gradient(rgba(0,0,0,0.85), rgba(0,0,0,0.75));
  border-radius: 15px;
  backdrop-filter: blur(12px);
  padding: 40px;
  width: 320px;
  text-align: center;
  z-index: 1;
  animation: fadeIn 1s ease-in-out;
  box-shadow: 0 8px 32px rgba(0,0,0,0.3);
}

      border-radius: 15px;
      backdrop-filter: blur(12px);
      padding: 40px;
      width: 320px;
      text-align: center;
      z-index: 1;
      animation: fadeIn 1s ease-in-out;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h2 {
      margin-bottom: 10px;
      font-size: 26px;
      font-weight: bold;
      background: #fff;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: gradientMove 5s infinite linear;
      background-size: 300% 300%;
      display: inline-block;
    }

    .emoji {
      font-size: 26px;
      margin-left: 6px;
      transition: opacity 0.5s ease;
    }

    @keyframes gradientMove {
      0% { background-position: 0% 50%; }
      100% { background-position: 100% 50%; }
    }

    .tagline {
      color: #eee;
      font-size: 14px;
      margin-bottom: 20px;
      letter-spacing: 1px;
    }

    .input-container {
      position: relative;
      margin: 10px 0;
    }

    .input-container .icon {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 14px;
      color: #fff;
    }

    input {
      width: 100%;
      padding: 12px 12px 12px 35px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
      box-sizing: border-box;
    }

    input::placeholder {
      color: #fff;
    }

    input:focus {
      background: rgba(255, 255, 255, 0.3);
      box-shadow: 0 0 8px rgba(39, 174, 96, 0.7);
    }

    .password-container {
      position: relative;
    }

    .toggle-password {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      font-size: 14px;
      color: #eee;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 15px;
      border: none;
      border-radius: 8px;
      background: linear-gradient(to right, #27ae60, #2ecc71);
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.2s, background 0.3s;
    }

    button:hover {
      transform: scale(1.05);
      background: linear-gradient(to right, #219150, #27ae60);
    }

    @keyframes shake {
      0% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      50% { transform: translateX(5px); }
      75% { transform: translateX(-5px); }
      100% { transform: translateX(0); }
    }

    .shake {
      animation: shake 0.5s;
    }

    /* Success message */
    .success-msg {
      margin-top: 15px;
      color: #2ecc71;
      font-weight: bold;
      display: none;
    }
  </style>
</head>
<body>
  <div class="overlay"></div>
  <div class="login-container">
    <h2 id="welcome-msg"></h2><span id="emoji" class="emoji"></span>

    <div class="input-container">
      <span class="icon">👤</span>
      <input type="text" id="username" placeholder="Enter Username">
    </div>

    <div class="input-container password-container">
      <span class="icon">🔒</span>
      <input type="password" id="password" placeholder="Enter Password">
      <span class="toggle-password" onclick="togglePassword()">👁️</span>
    </div>
    
    <button onclick="login()">Login</button>

    <p id="success" class="success-msg">✅ Login Successfully...</p>
  </div>

  <script>
    function login() {
      const user = document.getElementById("username").value.trim();
      const pass = document.getElementById("password").value.trim();
      const successMsg = document.getElementById("success");

      if (user === "admin" && pass === "admin1234") {
        successMsg.style.display = "block";
        setTimeout(() => {
          window.location.href = "23.html"; // redirect after 2 sec
        }, 2000);
      } else {
        alert("❌ Invalid username or password. Try again!");
        document.querySelector(".login-container").classList.add("shake");
        setTimeout(() => {
          document.querySelector(".login-container").classList.remove("shake");
        }, 500);
      }
    }

    function togglePassword() {
      const passwordField = document.getElementById("password");
      passwordField.type = passwordField.type === "password" ? "text" : "password";
    }

    // Emoji animation
    const emojis = ["🍕", "🍔", "🥗", "🍩", "🍣", "🍜", "🍟", "🌮", "🥪", "🍰"];
    let currentEmojiIndex = 0;

    // Typing effect for welcome text
    const welcomeText = "Login to Your Food Explorer Account";
    let i = 0;
    function typeWriter() {
      if (i < welcomeText.length) {
        document.getElementById("welcome-msg").textContent += welcomeText.charAt(i);
        i++;
        setTimeout(typeWriter, 100);
      } else {
        document.getElementById("emoji").textContent = " " + emojis[currentEmojiIndex];
        // Change emoji every 3s
        setInterval(() => {
          currentEmojiIndex = (currentEmojiIndex + 1) % emojis.length;
          const emojiSpan = document.getElementById("emoji");
          emojiSpan.style.opacity = 0;
          setTimeout(() => {
            emojiSpan.textContent = " " + emojis[currentEmojiIndex];
            emojiSpan.style.opacity = 1;
          }, 500);
        }, 3000);
      }
    }
    typeWriter();
  </script>
</body>
</html>
